name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in src/main/*.js src/preload/*.js src/renderer/app.js; do
            node --check "$f"
          done
      - name: Unit tests
        run: node --test "test/*.test.js"
